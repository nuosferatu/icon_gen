<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <title>画境</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <a class="brand" href="/"><span>画境</span></a>
  <button id="logout" class="link hidden">退出登录</button>
</header>
<main>
  <section id="login" class="login hidden">
    <div class="login-card">
      <h1>登录</h1>
      <form id="login-form">
        <label for="password">访问密码</label>
        <input id="password" type="password" placeholder="输入密码" required autocomplete="current-password">
        <button class="primary" type="submit">登录</button>
      </form>
    </div>
  </section>
  <section id="studio" class="studio hidden">
    <aside class="sidebar">
      <div class="side-heading"><h2>预设 <span id="preset-count">0</span></h2></div>
      <button id="new" class="outline">＋ 新建对话</button>
      <div class="divider"></div>
      <div id="presets" class="preset-list"></div>
    </aside>
    <div class="workspace">
      <div class="workspace-top"><h1>图像工作室</h1></div>
      <div id="active-preset" class="active-preset hidden"></div>
      <div class="panels">
        <section class="conversation panel">
          <div class="panel-head"><h3>对话</h3></div>
          <div id="messages" class="messages"></div>
          <form id="chat-form" class="composer">
            <textarea id="message" placeholder="输入图像需求或修改意见" rows="3" maxlength="6000" required></textarea>
            <div class="composer-foot"><span>SVG 图标</span><button type="submit" class="send" aria-label="发送">↑</button></div>
          </form>
        </section>
        <section class="preview panel">
          <div class="panel-head"><h3>图像预览</h3></div>
          <div id="image-wrap" class="image-wrap">
            <div class="empty-image">暂无图片</div>
            <img id="image" class="hidden" alt="生成的图片">
          </div>
          <div class="preview-foot"><a id="download" class="download hidden" download="image.svg">下载图片</a></div>
          <button id="save" class="primary save" disabled>保存预设</button>
        </section>
      </div>
    </div>
  </section>
</main>
<div id="toast" class="toast hidden" role="status"></div>
<script src="/app.js" type="module"></script>
</body>
</html>
